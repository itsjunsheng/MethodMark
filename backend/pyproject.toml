[project]
name = "methodmark-backend"
version = "0.1.0"
description = "FastAPI backend for the MethodMark mathematics assessment platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = ["pytest>=8.3,<10.0", "ruff>=0.11,<1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
